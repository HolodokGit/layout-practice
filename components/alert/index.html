<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="alert alert--success">
            <span class="alert__text">Операция выполнена успешно</span>
            <button class="alert__close">x</button>
        </div>

        <div class="alert alert--error">
            <span class="alert__text">Произошла ошибка. Попробуйте снова.</span>
            <button class="alert__close">x</button>
        </div>

        <div class="alert alert--warning">
            <span class="alert__text">Внимание! Проверьте данные.</span>
            <button class="alert__close">x</button>
        </div>
    </div>
</body>
</html>
