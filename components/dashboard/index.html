<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <aside class="dashboard__sidebar">
            <h2 class="dashboard__logo">Logo</h2>
            <nav class="dashboard__nav">
                <a href="" class="dashboard__link dashboard__link--active">Главная</a>
                <a href="" class="dashboard__link">Анализы</a>
                <a href="" class="dashboard__link">Заказы</a>
                <a href="" class="dashboard__link">Настройки</a>
            </nav>
        </aside>

        <header class="dashboard__header">
            <h1 class="dashboard__title">Дашборд</h1>
            <div class="dashboard__user">Иванов Иван</div>
        </header>

        <main class="dashboard__content">
            <div class="dashboard__widgets">
                <div class="widget">
                    <span class="widget__label">Пользователи</span>
                    <span class="widget__value">1 234</span>
                </div>
                <div class="widget">
                    <span class="widget__label">Выручка</span>
                    <span class="widget__value">89 000 ₽</span>
                </div>
                <div class="widget">
                    <span class="widget__label">Конверсия</span>
                    <span class="widget__value">4.2%</span>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
