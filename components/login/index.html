<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form class="login">
            <h2 class="login__title">Вход</h2>

            <div class="login__field">
                <label for="email" class="login__label">Email</label>
                <input type="email" id="email" class="login__input" placeholder="email@example.com">
            </div>

            <div class="login__field">
                <label for="password" class="login__label">Password</label>
                <input type="password" id="password" class="login__input" placeholder="*********">
            </div>

            <button class="login__button" type="submit">Войти</button>
            <a href="#" class="login__link">Забыли пароль?</a>
        </form>
    </div>
</body>
</html>
